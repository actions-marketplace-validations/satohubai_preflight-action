name: "Sato Preflight"
description: "Preflight for your dependency manifest: what Sato Hub has on record per package, as a table and diff annotations."
author: "Sato Hub"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  mode:
    description: "preflight (default) | template-drift. template-drift reads sato.create.json + sato.lock.json from the repo root and opens exactly one issue per material change, ever (needs `issues: write`). Without sato.create.json it exits 0 with a notice."
    required: false
    default: "preflight"
  fail_on_error:
    description: "template-drift only. true makes the step exit non-zero when the drift endpoint or the GitHub API cannot be reached. Default false."
    required: false
    default: "false"
  manifest:
    description: "Path to the dependency manifest to check. package.json or requirements.txt."
    required: false
    default: "package.json"
  manifest-kind:
    description: "Force the manifest kind: package.json or requirements.txt. Empty = inferred from the filename."
    required: false
    default: ""
  packages:
    description: "Extra package names to check, newline- or comma-separated. Checked alongside the manifest."
    required: false
    default: ""
  repos:
    description: "GitHub repositories (owner/name or URLs) to check, newline- or comma-separated."
    required: false
    default: ""
  endpoints:
    description: "https MCP endpoints to check. These are the only inputs that cause a live probe, and only because you typed them here — nothing in your manifest is ever contacted."
    required: false
    default: ""
  agents:
    description: "ERC-8004 agent references (<chain>:<id>, e.g. base:42) to check, newline- or comma-separated."
    required: false
    default: ""
  fail_on:
    description: "Comma list. One of no (default) | caution | none — the Preflight verdict that makes this step exit non-zero — plus, optionally, key_egress_observed: fail only when Sato Check saw a planted key leave during a run for a dependency the PR adds or changes. `unknown` never fails a build at any setting."
    required: false
    default: "no"
  fail-on:
    description: "Alias for fail_on; the two are merged."
    required: false
    default: ""
  custody:
    description: "true (default) | false. On pull_request events, run Sato Check over the dependencies, MCP config servers and skill files the PR adds or changes, and report the four custody answers."
    required: false
    default: "true"
  github-token:
    description: "Token used to post one sticky PR comment with the Sato Check report. Needs `pull-requests: write`; without it the report goes to the job summary only."
    required: false
    default: ${{ github.token }}
  annotations:
    description: "Emit GitHub annotations on the manifest lines. true (default) or false."
    required: false
    default: "true"
  api:
    description: "Sato Hub API base URL."
    required: false
    default: "https://satohub.ai"

outputs:
  verdict:
    description: "The most severe verdict in the run: no | caution | go | unknown."
    value: ${{ steps.run.outputs.verdict }}
  go:
    description: "Count of targets with verdict go."
    value: ${{ steps.run.outputs.go }}
  caution:
    description: "Count of targets with verdict caution."
    value: ${{ steps.run.outputs.caution }}
  no:
    description: "Count of targets with verdict no."
    value: ${{ steps.run.outputs.no }}
  unknown:
    description: "Count of targets Sato Hub holds no record of. Informational — never a failure."
    value: ${{ steps.run.outputs.unknown }}
  total:
    description: "Number of targets checked."
    value: ${{ steps.run.outputs.total }}
  sarif:
    description: "Path to the written SARIF log, for actions/upload-sarif."
    value: ${{ steps.run.outputs.sarif }}
  report:
    description: "The markdown report written to the job summary."
    value: ${{ steps.run.outputs.report }}
  custody_subjects:
    description: "Number of changed dependencies Sato Check answered for (0 outside pull requests)."
    value: ${{ steps.run.outputs.custody_subjects }}
  key_egress_observed:
    description: "true when Sato Check reports a planted key seen leaving for a changed dependency."
    value: ${{ steps.run.outputs.key_egress_observed }}
  drift_changes:
    description: "template-drift only: number of material changes the drift endpoint reported."
    value: ${{ steps.run.outputs.drift_changes }}
  drift_opened:
    description: "template-drift only: number of issues opened by this run."
    value: ${{ steps.run.outputs.drift_opened }}
  policy_violations:
    description: "Number of readings that matched a rule in the repository's .sato/policy.json (0 without a policy file)."
    value: ${{ steps.run.outputs.policy_violations }}

runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_MANIFEST-KIND: ${{ inputs.manifest-kind }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_REPOS: ${{ inputs.repos }}
        INPUT_ENDPOINTS: ${{ inputs.endpoints }}
        INPUT_AGENTS: ${{ inputs.agents }}
        INPUT_FAIL_ON: ${{ inputs.fail_on }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_API: ${{ inputs.api }}
        INPUT_FAIL-ON: ${{ inputs.fail-on }}
        INPUT_CUSTODY: ${{ inputs.custody }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
      run: node "${{ github.action_path }}/src/main.mjs"
